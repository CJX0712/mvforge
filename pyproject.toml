[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mvforge"
version = "1.0.0"
description = "多模态/多视图表征学习与融合系统 (纯 numpy 离线兜底 + 可选 mvlearn/torch SOTA 后端)"
authors = [{ name = "晨星" }]
requires-python = ">=3.10"
dependencies = ["numpy>=2.0", "scipy>=1.10", "scikit-learn>=1.3"]
readme = "README.md"
license = { text = "MIT" }

[project.optional-dependencies]
sota = ["mvlearn>=0.6.0", "torch>=2.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
filterwarnings = ["ignore::UserWarning"]

[tool.ruff]
line-length = 96
target-version = "py310"
